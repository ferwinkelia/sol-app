<title>Mamaderas de Sol</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Rubik:wght@500;600;700&family=Great+Vibes&display=swap">
<style>
/* Layout: una columna para celular; foto con corte curvo, tarjetas blancas, menú inferior fijo */
:root{
  --bg:#EEF3F6; --surface:#FFFFFF; --surface2:#F5F8FA; --ink:#1B2A35; --muted:#5C6F7E; --line:#D5E0E7; --line2:#E6ECF0;
  --accent:#2C6A9E; --accent-ink:#FFFFFF; --accent-soft:#E3ECF5; --warm:#C9711E; --warm-ink:#FFFFFF; --warm-soft:#FBEBDB; --warm-text:#A65A12;
  --stop:#C62F25; --stop-ink:#FFFFFF; --hero:#D5E0E7; --pis-bg:#FBF0C4; --pis:#7A5D00; --caca-bg:#F2E3D4; --caca:#6E4220;
  --danger:#B3392F; --bar:#2C6A9E; --bar2:#B9C3CC; --overlay:rgba(10,20,28,.45); --toast-bg:#1B2A35; --toast-ink:#FFFFFF;
  --m-bg:#D7F0E4; --m-ink:#1B5139; --m-chip:#FFFFFF; --m-acc:#2B7A58; --m-acc-ink:#FFFFFF;
  --p-bg:#E3E2F8; --p-ink:#3A3580; --p-chip:#FFFFFF; --p-acc:#4A4596; --p-acc-ink:#FFFFFF; --name:#A85F80; --m-box:#C6E8D7; --p-box:#D3D1F2;
  --display:"Rubik", system-ui, sans-serif; --body:"Atkinson Hyperlegible", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]):not([data-app-theme="light"]){
  --bg:#0E151B; --surface:#17222B; --surface2:#0E151B; --ink:#E4EDF3; --muted:#90A4B4; --line:#344756; --line2:#283844;
  --accent:#7DB3E0; --accent-ink:#0E151B; --accent-soft:#1E3446; --warm:#EDA45E; --warm-ink:#1B1208; --warm-soft:#3A2A1A; --warm-text:#EDA45E;
  --stop:#D9443A; --stop-ink:#FFFFFF; --hero:#1E2C37; --pis-bg:#3A3014; --pis:#EBC64E; --caca-bg:#36261A; --caca:#DDA97B;
  --danger:#F08378; --bar:#7DB3E0; --bar2:#4A5A68; --overlay:rgba(0,0,0,.6); --toast-bg:#E4EDF3; --toast-ink:#0E151B;
  --m-bg:#173328; --m-ink:#A9E2C6; --m-chip:#1F4536; --m-acc:#4FB38A; --m-acc-ink:#0C1E16;
  --p-bg:#25233F; --p-ink:#C9C6F5; --p-chip:#33305A; --p-acc:#8E89D6; --p-acc-ink:#12102A; --name:#DDA3BF; --m-box:#1F4536; --p-box:#33305A; color-scheme:dark}}
:root[data-theme="dark"]:not([data-app-theme="light"]), :root[data-app-theme="dark"]{
  --bg:#0E151B; --surface:#17222B; --surface2:#0E151B; --ink:#E4EDF3; --muted:#90A4B4; --line:#344756; --line2:#283844;
  --accent:#7DB3E0; --accent-ink:#0E151B; --accent-soft:#1E3446; --warm:#EDA45E; --warm-ink:#1B1208; --warm-soft:#3A2A1A; --warm-text:#EDA45E;
  --stop:#D9443A; --stop-ink:#FFFFFF; --hero:#1E2C37; --pis-bg:#3A3014; --pis:#EBC64E; --caca-bg:#36261A; --caca:#DDA97B;
  --danger:#F08378; --bar:#7DB3E0; --bar2:#4A5A68; --overlay:rgba(0,0,0,.6); --toast-bg:#E4EDF3; --toast-ink:#0E151B;
  --m-bg:#173328; --m-ink:#A9E2C6; --m-chip:#1F4536; --m-acc:#4FB38A; --m-acc-ink:#0C1E16;
  --p-bg:#25233F; --p-ink:#C9C6F5; --p-chip:#33305A; --p-acc:#8E89D6; --p-acc-ink:#12102A; --name:#DDA3BF; --m-box:#1F4536; --p-box:#33305A; color-scheme:dark}
:root[data-app-theme="light"]{color-scheme:light}
html{overscroll-behavior-y:none}
body::before{content:'';position:fixed;left:0;right:0;top:0;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:16;opacity:0;transition:opacity .15s;pointer-events:none}
body.scrolled::before{opacity:1}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
*{box-sizing:border-box}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
button,input,select{font-family:var(--body);font-size:1rem;color:var(--ink)}
button{cursor:pointer}
button:focus-visible,a:focus-visible,.filebtn:focus-within{outline:3px solid var(--accent);outline-offset:2px}
input:focus,input:focus-visible{outline:none;border-color:var(--accent)!important;box-shadow:0 0 0 1px var(--accent)}
input[type=range]:focus,input[type=checkbox]:focus{box-shadow:none}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance}

/* Foto */
.hero{position:relative;max-width:600px;margin:0 auto;height:clamp(92px,15vh,170px);background:var(--hero);border-radius:0 0 50% 50% / 0 0 44px 44px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.homepage{display:flex;flex-direction:column;min-height:calc(100vh - 84px - env(safe-area-inset-bottom,0px) - env(safe-area-inset-top,0px));min-height:calc(100dvh - 84px - env(safe-area-inset-bottom,0px) - env(safe-area-inset-top,0px))}
.homepage .hero{flex:1 0 auto;height:auto;min-height:clamp(92px,15vh,170px);width:100%}
.homepage .wrap{width:100%;padding-bottom:8px;flex:1}
.hero .ph{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--muted);font-weight:700;font-size:14px;background:none;border:none}
.hero .gear{position:absolute;top:12px;right:max(16px,env(safe-area-inset-right,0px));width:44px;height:44px;border-radius:50%;border:none;background:var(--surface);opacity:.92;display:grid;place-items:center;color:var(--ink)}
.namerow{display:flex;align-items:baseline;gap:10px;padding:2px 4px 0;flex-wrap:wrap}
.namerow h1{font-size:28px;line-height:1.05}
.namerow span{color:var(--muted);font-size:14px}

.hero .namechip{position:absolute;left:max(24px,env(safe-area-inset-left,0px));bottom:16px;background:var(--surface);color:var(--ink);border-radius:18px;padding:5px 14px 6px;display:flex;align-items:baseline;gap:8px}
.hero .namechip h1{font-size:22px;line-height:1.1}
.hero .namechip span{font-size:13px;color:var(--muted)}
/* Encabezado: franja, foto redonda y nombre en cursiva */
.head{position:relative;max-width:600px;margin:0 auto;width:100%;--av:clamp(112px,15vh,136px);--l:max(18px,env(safe-area-inset-left,0px));height:calc(env(safe-area-inset-top,0px) + 22px + var(--av));flex:none}
.head .band{position:absolute;inset:0 0 34px 0;background:var(--hero);border-radius:0 0 160px 0}
.head .av{position:absolute;left:var(--l);bottom:0;width:var(--av);height:var(--av);border-radius:50%;border:5px solid var(--bg);background:var(--line2);overflow:hidden;display:grid;place-items:center;padding:0;color:var(--muted)}
.head .av img{width:100%;height:100%;object-fit:cover;display:block}
.head .av span{font-size:12px;font-weight:700}
.head .nm{position:absolute;top:0;bottom:0;left:calc(var(--l) + var(--av) + 14px);right:12px}
.head .nm h1{position:absolute;left:0;bottom:calc(41px - .275em);font-family:"Great Vibes",cursive;font-weight:400;font-size:clamp(44px,12vw,52px);line-height:1;color:var(--name);margin:0;padding:0 10px 0 0;white-space:nowrap}
.head .nm span{position:absolute;left:3px;top:calc(100% - 29px);font-size:13px;line-height:1;letter-spacing:.06em;color:var(--muted);white-space:nowrap}
.head .gear{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));width:44px;height:44px;border-radius:50%;border:none;background:var(--line2);display:grid;place-items:center;color:var(--ink)}
.sbox{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;border-radius:16px;padding:7px 12px;font-variant-numeric:tabular-nums}
.mcard .sbox{background:var(--m-box)} .pcard .sbox{background:var(--p-box)}
.sbox>div{display:flex;flex-direction:column;min-width:0}
.sbox b{font-family:var(--display);font-weight:600;font-size:19px;line-height:1.15}
.sbox span{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scrollhint{text-align:center;font-size:12px;color:var(--muted);padding:2px 0 4px;margin-top:auto}
/* Historial en Inicio */
.hhead{display:flex;align-items:center;gap:8px;position:relative;padding-top:14px}
.hhead h2{flex:1;font-size:22px}
.smallbtn{border:none;border-radius:999px;background:var(--surface);color:var(--accent);min-height:38px;padding:0 14px;font-weight:700;font-size:13px}
.iconbtn{width:38px;height:38px;border:none;border-radius:50%;background:var(--line2);color:var(--ink);display:grid;place-items:center;padding:0}
.iconbtn.on{background:var(--accent);color:var(--accent-ink)}
.fmenu{position:absolute;top:58px;right:0;z-index:5;width:180px;background:var(--surface);border:1px solid var(--line2);border-radius:14px;padding:4px;display:flex;flex-direction:column;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.fmenu button{border:none;background:transparent;color:var(--ink);border-radius:10px;min-height:42px;padding:0 12px;text-align:left;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.fmenu button[aria-checked="true"]{background:var(--line2);font-weight:700}
.morebtn{border:none;border-radius:999px;background:var(--surface);color:var(--accent);min-height:44px;font-weight:700;font-size:14px}
.medrow{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line2);padding-right:10px}
.medrow:last-child{border-bottom:none}
.medrow .item{border-bottom:none;flex:1;min-width:0}
/* Inicio en pastel */
.home{gap:8px}
.set>.fld{flex:none}
.fld input[type=date],.fld input[type=time]{-webkit-appearance:none;appearance:none;min-width:0;max-width:100%;display:block;text-align:center;height:46px;line-height:44px;padding-top:0;padding-bottom:0}
.fld input::-webkit-date-and-time-value{text-align:center;margin:0}
.grid.small .opt{min-height:40px;font-size:14px}
.grid.small .opt.txt{font-size:13px}
.sheet>.fld,.sheet>div>.fld{flex:none}
.mcard,.pcard{border-radius:28px;padding:12px 16px 14px;display:flex;flex-direction:column;gap:9px}
.mcard{background:var(--m-bg);color:var(--m-ink)}
.pcard{background:var(--p-bg);color:var(--p-ink)}
.mcard.active{box-shadow:inset 0 0 0 2px var(--m-acc)}
.hrow{display:flex;align-items:center;gap:12px}
.hrow .bd{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none}
.mcard .bd{background:var(--m-chip)} .pcard .bd{background:var(--p-chip)}
.hrow .tt{flex:1;min-width:0;display:flex;flex-direction:column}
.hrow h2{font-size:18px;line-height:1.15}
.ago{text-align:right;display:flex;flex-direction:column;align-items:flex-end;flex:none}
.ago b{font-family:var(--display);font-weight:700;font-size:28px;line-height:1}
.ago span{font-size:12px}
.line{font-size:14px}
.pillbtn{border:none;border-radius:999px;min-height:52px;font-family:var(--display);font-weight:600;font-size:19px;background:var(--m-acc);color:var(--m-acc-ink)}
.chipbtn{border:none;border-radius:999px;min-height:50px;font-weight:700;font-size:15px;background:var(--p-chip);color:var(--p-ink)}
.chipbtn.both{background:var(--p-acc);color:var(--p-acc-ink)}
.mini-links{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mlink{border:none;background:none;color:inherit;text-decoration:underline;font-size:13px;min-height:36px;padding:2px 4px}
.resumebtn{flex:1;border:1px dashed currentColor;background:transparent;color:inherit;border-radius:999px;min-height:42px;font-size:14px;padding:0 12px}
.mlbox{display:flex;gap:8px}
.mlbox input{flex:1;min-width:0;text-align:center;font-family:var(--display);font-size:26px;font-weight:600;background:var(--surface2);border:1px solid var(--line2);border-radius:14px;min-height:56px}
.mlbox .opt{min-width:64px}
/* Aviso */
.nap{display:flex;align-items:center;gap:10px;border-radius:999px;padding:8px 16px 8px 10px;background:var(--stop);color:var(--stop-ink)}
.nap.go{background:var(--surface);color:var(--ink);border:1.5px solid var(--accent)}
.nap .ic{width:26px;height:26px;border-radius:50%;border:2px solid currentColor;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:15px;flex:none}
.nap .tx{flex:1;min-width:0;font-weight:700;font-size:15px}
.nap .clk{font-family:var(--display);font-weight:700;font-size:22px;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:no-preference){.nap:not(.go) .ic{animation:pulse 1.6s ease-in-out infinite}@keyframes pulse{50%{transform:scale(1.15)}}}

/* Tarjetas */
.card{background:var(--surface);border:1px solid var(--line2);border-radius:18px;padding:14px 16px 16px;display:flex;flex-direction:column;gap:12px}
.card.active{border:1.5px solid var(--warm)}
.chead{display:flex;align-items:center;gap:12px}
.badge{width:38px;height:38px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.card.active .badge{background:var(--warm-soft);color:var(--warm-text)}
.chead .t{flex:1;min-width:0;display:flex;flex-direction:column}
.chead h2,.card h2{font-size:17px;line-height:1.2}
.sub{font-size:13px;color:var(--muted)}
.sub b{color:var(--ink)}
.side{font-size:13px;color:var(--muted);text-align:right}
.side b{color:var(--ink)}
.big{font-family:var(--display);font-weight:700;font-size:28px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line2);border-bottom:1px solid var(--line2);padding:10px 0}
.stats>div{display:flex;flex-direction:column;min-width:0}
.stats>div+div{border-left:1px solid var(--line2);padding-left:10px}
.stats b{font-family:var(--display);font-weight:600;font-size:20px;line-height:1.1}
.stats span{font-size:12px;color:var(--muted)}
.lbl{font-size:13px;color:var(--muted)}
.grid{display:grid;gap:6px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.opt{border:1px solid var(--line);border-radius:12px;background:var(--surface);min-height:50px;font-family:var(--display);font-weight:600;font-size:17px;padding:4px}
.opt.txt{font-family:var(--body);font-weight:700;font-size:15px}
.opt.sel{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.primary{border:none;border-radius:14px;background:var(--accent);color:var(--accent-ink);min-height:56px;font-family:var(--display);font-weight:600;font-size:19px;padding:0 16px}
.primary.warm{background:var(--warm);color:var(--warm-ink);min-height:60px;font-size:20px}
.ghost{border:1px solid var(--line);border-radius:14px;background:var(--surface);min-height:52px;font-weight:700;font-size:15px;padding:0 14px}
.link{border:none;background:none;color:var(--muted);text-decoration:underline;font-size:13px;min-height:40px;padding:4px 6px}
.link.acc{color:var(--accent)}
.links{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.cargado{border-top:1px solid var(--line2);border-bottom:1px solid var(--line2);padding:10px 0;display:flex;flex-direction:column;gap:4px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.row.base{align-items:baseline}
.resume{border:1px dashed var(--line);border-radius:12px;background:transparent;min-height:46px;font-size:14px}
.timer{font-family:var(--display);font-weight:700;font-size:28px;font-variant-numeric:tabular-nums}

/* Historial */
.top{padding-top:calc(16px + env(safe-area-inset-top,0px))}
.top h1{font-size:28px}
.seg{display:flex;background:var(--line2);border-radius:12px;padding:3px}
.seg button{flex:1;border:none;border-radius:10px;background:transparent;color:var(--muted);min-height:38px;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;gap:2px 10px;flex-wrap:wrap;padding:6px 4px 0}
.dayhead h2{font-size:16px}
.dayhead span{font-size:12px;color:var(--muted)}
.list{background:var(--surface);border:1px solid var(--line2);border-radius:16px;overflow:hidden}
.item{width:100%;border:none;border-bottom:1px solid var(--line2);background:transparent;text-align:left;display:flex;align-items:center;gap:12px;padding:11px 14px}
.item:last-child{border-bottom:none}
.item .ib{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--accent-soft);color:var(--accent)}
.item .ib{background:var(--m-chip);color:var(--m-ink)}
.item.p .ib{background:var(--p-chip);color:var(--p-ink)}
#historial .list{border:none}
.item .mid{flex:1;min-width:0;display:flex;flex-direction:column}
.item .mid b{font-size:15px}
.item .ml{font-family:var(--display);font-weight:600;font-size:17px;white-space:nowrap}
.tags{display:flex;gap:4px}
.tag{font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px}
.tag.pis{background:var(--pis-bg);color:var(--pis)}
.tag.caca{background:var(--caca-bg);color:var(--caca)}
.pill{font-size:11px;font-weight:700;padding:1px 8px;border-radius:99px;background:var(--warm-soft);color:var(--warm-text);margin-left:6px}
.empty{color:var(--muted);text-align:center;padding:28px 12px}

/* Resumen */
.month{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line2);border-radius:999px;padding:3px}
.month button{width:38px;height:38px;border-radius:50%;border:none;background:transparent;font-size:20px;font-weight:700}
.month button:disabled{color:var(--line);cursor:default}
.month span{font-weight:700;font-size:14px;min-width:84px;text-align:center;text-transform:capitalize}
.spend{background:var(--accent);color:var(--accent-ink);border-radius:20px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.spend .lb{font-size:13px;opacity:.88}
.spend .tot{font-family:var(--display);font-weight:700;font-size:36px;line-height:1}
.spend .two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.spend .two>div{background:rgba(255,255,255,.14);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;min-width:0}
.spend .two b{font-family:var(--display);font-weight:600;font-size:19px}
.spend .two span{font-size:12px;opacity:.88}
.bars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-items:end;height:160px;padding:0 6px;border-bottom:1px solid var(--line2)}
.bar{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%}
.bar span{font-size:12px;font-weight:700}
.bar .stk{width:100%;max-width:44px;display:flex;flex-direction:column}
.bar .s{background:var(--bar2);border-radius:5px 5px 0 0}
.bar .t{background:var(--bar);border-radius:0 0 4px 4px}
.bar .stk.only .t{border-radius:5px 5px 4px 4px}
.xl{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;padding:0 6px;font-size:12px;color:var(--muted);text-align:center}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.mini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mini>div{background:var(--surface);border:1px solid var(--line2);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;min-width:0}
.mini b{font-family:var(--display);font-weight:600;font-size:20px;line-height:1.15}
.mini span{font-size:12px;color:var(--muted)}

/* Ajustes */
.set{background:var(--surface);border:1px solid var(--line2);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:12px}
.set h2{font-size:17px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0;flex:1 1 140px}
.fld input{background:var(--surface2);border:1px solid var(--line2);border-radius:12px;min-height:46px;padding:0 12px;font-size:16px;width:100%}
.fields{display:flex;gap:10px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:6px}
.step button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:20px;font-weight:700}
.step b{font-family:var(--display);font-weight:600;font-size:17px;min-width:62px;text-align:center}
.sw{width:52px;height:32px;border-radius:999px;border:none;background:var(--line);padding:3px;display:flex;justify-content:flex-start;flex:none}
.sw[aria-checked="true"]{background:var(--accent);justify-content:flex-end}
.sw i{width:26px;height:26px;border-radius:50%;background:var(--surface)}
.avatar{width:64px;height:64px;border-radius:50%;background:var(--hero);overflow:hidden;display:grid;place-items:center;color:var(--muted);flex:none}
.avatar img{width:100%;height:100%;object-fit:cover}
.filebtn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:12px;min-height:42px;padding:0 14px;font-weight:700;font-size:14px;color:var(--accent);background:var(--surface);cursor:pointer}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
input[type=range]{width:100%;accent-color:var(--accent);min-height:0;padding:0;border:none;background:none}
.hint{font-size:12px;color:var(--muted);margin:0}

/* Salud */
.medstrip{display:flex;align-items:center;gap:10px;border:none;border-radius:999px;background:var(--accent-soft);color:var(--accent);padding:8px 16px 8px 12px;min-height:44px;font-size:14px;text-align:left;width:100%}
.medstrip span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.medstrip.due{background:var(--warm-soft);color:var(--warm-text)}
.med{background:var(--surface);border:1px solid var(--line2);border-radius:22px;padding:12px 14px;display:flex;align-items:center;gap:12px}
.med.due{border:1.5px solid var(--warm)}
.med .info{flex:1;min-width:0;display:flex;flex-direction:column;background:none;border:none;text-align:left;padding:0}
.med .info b{font-family:var(--display);font-weight:600;font-size:17px}
.med .st{font-size:13px;color:var(--muted)}
.med.due .st{color:var(--warm-text);font-weight:700}
.med .give{border:none;border-radius:999px;background:var(--accent);color:var(--accent-ink);min-height:46px;padding:0 18px;font-family:var(--display);font-weight:600;font-size:16px;flex:none}
.med .give.done{background:var(--accent-soft);color:var(--accent)}
.growth{background:var(--surface);border:1px solid var(--line2);border-radius:22px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.gstats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.gstats>div{background:var(--surface2);border:1px solid var(--line2);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column}
.gstats b{font-family:var(--display);font-weight:700;font-size:24px;line-height:1.1}
.gstats .pc{font-size:13px;color:var(--accent);font-weight:700}
.chart{width:100%;height:auto;display:block}
.chart text{font-size:10px;fill:var(--muted);font-family:var(--body)}
/* Menú */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line2);padding:6px max(10px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));z-index:15}
.nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:2px}
.nav button{border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;color:var(--muted);font-size:11.5px;min-height:52px}
.nav button[aria-current="page"]{color:var(--accent);font-weight:700}

/* Hoja */
.sheetbg{position:fixed;inset:0;background:var(--overlay);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:12px max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;max-height:92vh;overflow:auto}
.sheet .grab{width:40px;height:4px;border-radius:99px;background:var(--line);align-self:center}
.sheet h2{font-size:21px}
.res{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.res>div{background:var(--surface2);border:1px solid var(--line2);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column}
.res b{font-family:var(--display);font-weight:700;font-size:28px;line-height:1.1}
.res .tm b{color:var(--accent)}
.foot{display:grid;grid-template-columns:1fr 2fr;gap:10px}
.danger{border:1px solid var(--danger);color:var(--danger);background:transparent;border-radius:14px;min-height:48px;font-weight:700}
.toggles{display:flex;gap:10px}
.tog{flex:1;display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-height:52px;font-weight:700;cursor:pointer}
.tog input{width:22px;height:22px;accent-color:var(--accent);margin:0}
.tog.pis:has(input:checked){background:var(--pis-bg);border-color:var(--pis);color:var(--pis)}
.tog.caca:has(input:checked){background:var(--caca-bg);border-color:var(--caca);color:var(--caca)}
.inp{background:var(--surface2);border:1px solid var(--line2);border-radius:12px;min-height:46px;padding:0 12px;font-size:16px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--toast-bg);color:var(--toast-ink);padding:10px 16px;border-radius:12px;z-index:30;max-width:90vw;font-size:15px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}
</style>

  <button data-act="tab" data-tab="inicio" aria-current="page"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>Inicio</button>
  <button data-act="tab" data-tab="salud"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/><path d="M9 11h6M12 8v6"/></svg>Salud</button>
  <button data-act="tab" data-tab="resumen"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V11M10 20V5M16 20v-7M2 20h20"/></svg>Resumen</button>

</div></nav>

<div id="sheet" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>

<script>
(function(){
  const $=id=>document.getElementById(id);
  const IC={
    bottle:s=>'<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 2h4"/><path d="M10.5 2v2.5L9 6h6l-1.5-1.5V2"/><rect x="7" y="6" width="10" height="16" rx="3"/><path d="M7 12h3M7 16h3"/></svg>',
    diaper:s=>'<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18v4a9 9 0 0 1-18 0z"/><path d="M8 6v3M16 6v3"/><path d="M8 14c1.2 1.2 2.5 1.8 4 1.8s2.8-.6 4-1.8"/></svg>',
    camera:'<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
    gear:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>'
  };
  const DEF={nombre:'Bebé',nacimiento:'',espera:15,retomarHoras:3,cargas:[60,80,100],recargas:[20,40,60],preguntarSobro:true,precios:[],fotoPos:35};

  let db=null,colT=null,colP=null,cfgRef=null,fotoRef=null,downloads=null,canWrite=true;
  let tomas=[],panales=[],meds=[],dosis=[],controles=[],cfg=Object.assign({},DEF),foto=null,loadedT=false;
  let colM=null,colD=null,colC=null,saludTab='med',gVar='peso';
  let tab='inicio',filtro='todo',mes=null,tick=null,fOpen=false,histDias=2;

  // ---------- utilidades ----------
  const pad=n=>String(n).padStart(2,'0');
  const hhmm=ms=>{const d=new Date(ms);return pad(d.getHours())+':'+pad(d.getMinutes());};
  const ymd=ms=>{const d=new Date(ms);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
  const mins=(a,b)=>Math.max(0,Math.round((b-a)/60000));
  const dur=m=>m<60?m+' min':Math.floor(m/60)+' h '+pad(m%60);
  const sum=a=>(a||[]).reduce((s,x)=>s+(Number(x)||0),0);
  const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const money=n=>'$'+Math.round(n).toLocaleString('es-AR');
  const dec=n=>n.toLocaleString('es-AR',{maximumFractionDigits:1});
  const lit=ml=>ml>=1000?dec(ml/1000)+' l':Math.round(ml)+' ml';
  function ajustarFin(inicio,fin){
    if(fin<inicio){ const f2=fin+864e5; if(f2-inicio<=4*3600e3) fin=f2; else { toast('La hora de fin es anterior al inicio. Revisala.'); return null; } }
    if(fin>Date.now()+5*60e3){ toast('La hora de fin todavía no llegó. Revisala.'); return null; }
    return fin;
  }
  function build(d,t){const [y,m,dd]=d.split('-').map(Number);const [h,mi]=t.split(':').map(Number);return new Date(y,m-1,dd,h,mi).getTime();}
  function dayLabel(k){const t=ymd(Date.now()),y=ymd(Date.now()-864e5);if(k===t)return 'Hoy';if(k===y)return 'Ayer';const [a,b,c]=k.split('-').map(Number);const s=new Date(a,b-1,c).toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'short'});return s.charAt(0).toUpperCase()+s.slice(1);}
  function edad(){
    if(!cfg.nacimiento) return '';
    const [y,m,d]=cfg.nacimiento.split('-').map(Number); const n=new Date(y,m-1,d).getTime();
    const dias=Math.floor((Date.now()-n)/864e5); if(!(dias>=0)) return '';
    if(dias<14) return dias===1?'1 día':dias+' días';
    if(dias<60) return Math.floor(dias/7)+' semanas';
    const meses=Math.floor(dias/30.44); return meses===1?'1 mes':meses+' meses';
  }
  const parseList=s=>String(s).split(/[^0-9]+/).map(Number).filter(n=>n>0&&n<=1000);

  // modelo de toma: cargas (lo que se puso en la mamadera), sobro, ml = lo que tomó
  const cargado=t=>(tomado(t)||0)+sobro(t);
  const sobro=t=>Number(t.sobro)||0;
  const tomado=t=>t.ml!=null&&t.ml!==''?Number(t.ml):null;
  const active=()=>tomas.find(t=>t.fin==null)||null;
  const lastDone=()=>{let b=null;tomas.forEach(t=>{if(t.fin!=null&&(!b||t.fin>b.fin))b=t;});return b;};
  const lastInicial=()=>{const t=tomas.find(x=>x.cargas&&x.cargas.length);return t?t.cargas[0]:null;};
  function precioEn(ms,kind){
    const p=(cfg.precios||[]).filter(x=>x&&(kind==='panal'?x.panalUnidades>0&&x.panalPrecio>0:x.lecheRinde>0&&x.lechePrecio>0)).sort((a,b)=>a.desde-b.desde);
    if(!p.length) return null; let r=p[0]; p.forEach(x=>{if(x.desde<=ms) r=x;}); return r;
  }

  // ---------- avisos y guardado ----------
  function toast(msg){const t=$('toast');t.textContent=msg;t.hidden=false;clearTimeout(t._h);t._h=setTimeout(()=>t.hidden=true,2600);}
  async function safe(fn,ok){
    try{await fn();if(ok)toast(ok);return true;}
    catch(e){
      if(e&&e.code==='invalid_argument'){canWrite=false;render();toast('No se pudo guardar: tu acceso es solo de lectura.');}
      else if(e&&e.code==='quota_exceeded') toast('El registro está lleno. Avisale a Fer.');
      else toast('No se pudo guardar. Revisá la conexión y probá de nuevo.');
      return false;
    }
  }
  let cfgQueue=Promise.resolve(true);
  function saveCfg(patch,ok){
    cfg=Object.assign({},cfg,patch);
    const data=Object.assign({},cfg);
    cfgQueue=cfgQueue.then(()=>safe(()=>cfgRef.set(data),ok));
    return cfgQueue;
  }

  // ---------- tema (por celular) ----------
  const TEMA_KEY='mamaderas_tema';
  function getTema(){try{return localStorage.getItem(TEMA_KEY)||'dark';}catch(e){return 'dark';}}
  function applyTema(v){
    try{localStorage.setItem(TEMA_KEY,v);}catch(e){}
    const r=document.documentElement;
    if(v==='light'||v==='dark') r.setAttribute('data-app-theme',v); else r.removeAttribute('data-app-theme');
  }
  applyTema(getTema());

  // ---------- render ----------
  function render(){
    document.querySelectorAll('.nav [data-tab]').forEach(b=>{ if(b.dataset.tab===tab) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); });
    const v=$('view');
    if(!db){ v.innerHTML='<div class="wrap" style="padding-top:24px"><p class="empty">Abrí esta página desde Claude con tu cuenta iniciada para ver y cargar las tomas.</p></div>'; return; }
    v.innerHTML = tab==='inicio'?vInicio() : tab==='salud'?vSalud() : tab==='resumen'?vResumen() : vAjustes();
    renderNap(); setupTimer();
  }
  function rerenderSoft(){
    if(!$('sheet').hidden) return;
    if(tab==='ajustes'){ const a=document.activeElement; if(a&&a.tagName==='INPUT'&&a.type!=='range') return; }
    const y=window.scrollY; render(); window.scrollTo(0,y);
  }

  function hero(){
    const e=edad();
    const img=foto?'<img src="'+foto+'" alt="Foto de '+esc(cfg.nombre)+'" style="object-position:50% '+(Number(cfg.fotoPos)||35)+'%">':'<span>Agregar foto</span>';
    return '<div class="head"><div class="band"></div><button class="av" data-act="tab" data-tab="ajustes" aria-label="Cambiar la foto en Ajustes">'+img+'</button><div class="nm"><h1>'+esc(cfg.nombre)+'</h1>'+(e?'<span>'+e+'</span>':'')+'</div><button class="gear" data-act="tab" data-tab="ajustes" aria-label="Ajustes">'+IC.gear+'</button></div>';
  }

  function vInicio(){
    let h='<div class="homepage">'+hero()+'<div class="wrap home" style="padding-top:10px">';
    h+='<div id="nap" class="nap" role="status" hidden></div>'+medStrip();
    if(!canWrite) h+='<p class="hint">Podés ver el registro, pero tu acceso no permite cargar datos. Pedile a Fer que te comparta la página como Editor.</p>';
    return h+cardToma()+cardPanal()+'<div class="scrollhint">Deslizá hacia abajo para ver el historial</div></div></div>'+vHistorial();
  }
  const sbox=vals=>'<div class="sbox">'+vals.map(([v,l])=>'<div><b>'+v+'</b><span>'+l+'</span></div>').join('')+'</div>';

  function cardToma(){
    const a=active(), today=ymd(Date.now());
    if(a){
      let h='<section class="mcard active"><div class="hrow"><span class="bd">'+IC.bottle(22)+'</span><div class="tt"><h2>Tomando</h2><span class="line num">desde las '+hhmm(a.inicio)+(a.retomas?' · retomó '+a.retomas:'')+(tomado(a)?' · llevaba '+tomado(a)+' ml':'')+'</span></div><div class="ago"><b class="num" id="timer">'+dur(mins(a.inicio,Date.now()))+'</b><span>tomando</span></div></div>';
      if(canWrite) h+='<button class="pillbtn" data-act="finish">Terminó</button><div class="mini-links"><button class="mlink" data-act="editToma" data-id="'+a.id+'">Corregir hora de inicio</button><button class="mlink" data-act="cancel">Cancelar toma</button></div>';
      return h+'</section>';
    }
    const hoy=tomas.filter(t=>ymd(t.inicio)===today), conMl=hoy.filter(t=>tomado(t)!=null);
    const ml=sum(conMl.map(tomado)), ld=lastDone();
    let h='<section class="mcard"><div class="hrow"><span class="bd">'+IC.bottle(22)+'</span><div class="tt"><h2>Mamadera</h2><span class="line num">'+
      (ld?'Última hace <b>'+dur(mins(ld.inicio,Date.now()))+'</b>'+(tomado(ld)!=null?' · tomó '+tomado(ld)+' ml':''):'Todavía no hay tomas')+'</span></div></div>';
    h+=sbox([[ml,'ml hoy'],[hoy.length,hoy.length===1?'toma':'tomas'],[conMl.length?Math.round(ml/conMl.length):'—','promedio'],[sum(hoy.map(sobro)),'ml sobró']]);
    if(canWrite){
      h+='<button class="pillbtn" data-act="start">Empezó a tomar</button>';
      const canRes=ld && Date.now()-ld.fin < (Number(cfg.retomarHoras)||3)*3600e3;
      h+='<div class="mini-links">'+(canRes?'<button class="resumebtn num" data-act="resume">Retomó la de las '+hhmm(ld.inicio)+'</button>':'<span></span>')+'<button class="mlink" data-act="manualToma">Cargar a mano</button></div>';
    }
    return h+'</section>';
  }

  const tipoTxt=p=>p.pis&&p.caca?'pis y caca':p.pis?'pis':'caca';
  const tagsHtml=p=>'<span class="tags">'+(p.pis?'<span class="tag pis">Pis</span>':'')+(p.caca?'<span class="tag caca">Caca</span>':'')+'</span>';
  function cardPanal(){
    const today=ymd(Date.now()), ph=panales.filter(p=>ymd(p.hora)===today), u=panales[0];
    const ay=ymd(Date.now()-864e5), pa=panales.filter(p=>ymd(p.hora)===ay);
    let h='<section class="pcard"><div class="hrow"><span class="bd">'+IC.diaper(22)+'</span><div class="tt"><h2>Pañal</h2><span class="line num">'+(u?'Último hace <b>'+dur(mins(u.hora,Date.now()))+'</b> · '+tipoTxt(u):'Todavía no hay cambios')+'</span></div></div>';
    h+=sbox([[ph.length,'cambios'],[ph.filter(p=>p.caca).length,'con caca'],[ph.filter(p=>p.pis).length,'con pis'],[pa.length,'ayer']]);
    if(canWrite) h+='<div class="grid g3"><button class="chipbtn" data-act="panal" data-pis="1" data-caca="0">Pis</button><button class="chipbtn" data-act="panal" data-pis="0" data-caca="1">Caca</button><button class="chipbtn both" data-act="panal" data-pis="1" data-caca="1">Los dos</button></div>';
    return h+'</section>';
  }

  function renderNap(){
    const el=$('nap'); if(!el) return;
    const ld=lastDone(), E=(Number(cfg.espera)||15)*60e3;
    if(active()||!ld){ el.hidden=true; return; }
    const left=ld.fin+E-Date.now();
    if(left>E){ el.hidden=true; return; }
    if(left>0){
      const s=Math.ceil(left/1000);
      el.className='nap'; el.hidden=false;
      el.innerHTML='<span class="ic" aria-hidden="true">!</span><span class="tx">Esperar para acostar · '+hhmm(ld.fin+E)+'</span><span class="clk">'+Math.floor(s/60)+':'+pad(s%60)+'</span>';
    } else if(-left<5*60e3){
      el.className='nap go'; el.hidden=false;
      el.innerHTML='<span class="ic" aria-hidden="true">✓</span><span class="tx">Ya se puede acostar</span>';
    } else el.hidden=true;
  }
  setInterval(renderNap,1000);
  addEventListener('scroll',()=>document.body.classList.toggle('scrolled',scrollY>8),{passive:true});
  function setupTimer(){
    clearInterval(tick); const a=active(); if(!a||tab!=='inicio') return;
    tick=setInterval(()=>{const el=$('timer'); if(el) el.textContent=dur(mins(a.inicio,Date.now()));},15000);
  }

  // ---------- salud: medicación ----------
  const activeMed=m=>m.activo!==false&&(!m.hasta||ymd(Date.now())<=m.hasta);
  const freqTxt=m=>m.tipo==='horas'?'cada '+m.cada+' h':(m.veces===1?'1 vez por día':m.veces+' veces por día');
  function medStatus(m){
    const now=Date.now(), ds=dosis.filter(d=>d.medId===m.id).sort((a,b)=>b.hora-a.hora), last=ds[0];
    if(m.tipo==='horas'){
      if(!last) return {last:null,due:true,txt:'Sin dosis registradas',short:'ahora'};
      const next=last.hora+(Number(m.cada)||6)*3600e3, left=next-now;
      const cuando=(ymd(next)===ymd(now)?'':ymd(next)===ymd(now+864e5)?'mañana ':new Date(next).toLocaleDateString('es-AR',{day:'numeric',month:'short'})+' ')+hhmm(next);
      return {last,next,due:left<=0,soon:left>0&&left<=30*60e3,txt:left<=0?'Tocaba a las '+hhmm(next):'Próxima: '+cuando,short:left<=0?'ahora':hhmm(next)};
    }
    const veces=Number(m.veces)||1, hoy=ds.filter(d=>ymd(d.hora)===ymd(now)).length;
    const due=hoy<veces&&(hoy===0||now-last.hora>=Math.max(1,24/veces-2)*3600e3);
    return {last,due,done:hoy>=veces,txt:hoy>=veces?'Listo por hoy':'Hoy '+hoy+' de '+veces,short:veces>1?(hoy+1)+'.ª de hoy':'de hoy'};
  }
  function medStrip(){

    if(!pend.length) return '';

    const names=pend.slice(0,3).map(x=>esc(x.m.nombre)+(x.m.tipo==='horas'?' '+x.s.short:'')).join(' · ')+(pend.length>3?' y '+(pend.length-3)+' más':'');
    return '<button class="medstrip'+(urg?' due':'')+'" data-act="tab" data-tab="salud"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><rect x="3" y="9" width="18" height="6" rx="3" transform="rotate(-45 12 12)"/><path d="M9.2 9.2l5.6 5.6"/></svg><span><b>Medicación:</b> '+names+'</span></button>';

  // ---------- salud: crecimiento (tablas OMS, niñas, P3 P15 P50 P85 P97 por mes) ----------
  const WFA=[[2.4,2.8,3.2,3.7,4.2],[3.2,3.6,4.2,4.8,5.4],[4.0,4.5,5.1,5.9,6.5],[4.6,5.1,5.8,6.7,7.4],[5.1,5.6,6.4,7.3,8.1],[5.5,6.1,6.9,7.8,8.7],[5.8,6.4,7.3,8.3,9.2],[6.1,6.7,7.6,8.7,9.6],[6.3,7.0,7.9,9.0,10.0],[6.6,7.3,8.2,9.3,10.4],[6.8,7.5,8.5,9.6,10.7],[7.0,7.7,8.7,9.9,11.0],[7.1,7.9,8.9,10.2,11.3],[7.3,8.1,9.2,10.4,11.6],[7.5,8.3,9.4,10.7,11.9],[7.7,8.5,9.6,10.9,12.2],[7.8,8.7,9.8,11.2,12.5],[8.0,8.8,10.0,11.4,12.7],[8.2,9.0,10.2,11.6,13.0],[8.3,9.2,10.4,11.9,13.3],[8.5,9.4,10.6,12.1,13.5],[8.7,9.6,10.9,12.4,13.8],[8.8,9.8,11.1,12.6,14.1],[9.0,9.9,11.3,12.8,14.3],[9.2,10.1,11.5,13.1,14.6]];
  const LFA=[[45.6,47.2,49.1,51.1,52.7],[50.0,51.7,53.7,55.7,57.4],[53.2,55.0,57.1,59.2,60.9],[55.8,57.6,59.8,62.0,63.8],[58.0,59.8,62.1,64.3,66.2],[59.9,61.7,64.0,66.3,68.2],[61.5,63.4,65.7,68.1,70.0],[62.9,64.9,67.3,69.7,71.6],[64.3,66.3,68.7,71.2,73.2],[65.6,67.6,70.1,72.6,74.7],[66.8,68.9,71.5,74.0,76.1],[68.0,70.2,72.8,75.4,77.5],[69.2,71.3,74.0,76.7,78.9],[70.3,72.5,75.2,77.9,80.2],[71.3,73.6,76.4,79.2,81.4],[72.4,74.7,77.5,80.3,82.7],[73.3,75.7,78.6,81.5,83.9],[74.3,76.7,79.7,82.6,85.0],[75.2,77.7,80.7,83.7,86.2],[76.2,78.7,81.7,84.8,87.3],[77.0,79.6,82.7,85.8,88.4],[77.9,80.5,83.7,86.8,89.4],[78.7,81.4,84.6,87.8,90.5],[79.6,82.2,85.5,88.8,91.5],[80.3,83.1,86.4,89.8,92.5]];
  const ZC=[-1.881,-1.036,0,1.036,1.881];
  function ncdf(z){const t=1/(1+.3275911*Math.abs(z)/Math.SQRT2);const y=1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-.284496736)*t+.254829592)*t*Math.exp(-z*z/2);return z>=0?(1+y)/2:(1-y)/2;}
  function rowAt(T,m){const i=Math.max(0,Math.min(23,Math.floor(m))),f=Math.max(0,Math.min(1,m-i));return T[i].map((v,k)=>v+(T[i+1][k]-v)*f);}
  function percentil(T,m,x){
    if(!(x>0)||m<0||m>24) return null; const r=rowAt(T,m); let z;
    if(x<=r[0]) z=ZC[0]+(x-r[0])*(ZC[1]-ZC[0])/(r[1]-r[0]);
    else if(x>=r[4]) z=ZC[4]+(x-r[4])*(ZC[4]-ZC[3])/(r[4]-r[3]);
    else for(let k=0;k<4;k++) if(x<=r[k+1]){ z=ZC[k]+(x-r[k])/(r[k+1]-r[k])*(ZC[k+1]-ZC[k]); break; }
    const p=ncdf(z)*100; return p<1?'menor a 1':p>99?'mayor a 99':String(Math.round(p));
  }
  function mesesEn(fecha){ if(!cfg.nacimiento) return null; const [a,b,c]=cfg.nacimiento.split('-').map(Number), [x,y,z]=fecha.split('-').map(Number); return (Date.UTC(x,y-1,z)-Date.UTC(a,b-1,c))/864e5/30.4375; }
  const fmt1=n=>n==null?'':Number(n).toLocaleString('es-AR',{maximumFractionDigits:2});
  const parseDec=v=>{const n=Number(String(v).trim().replace(',','.'));return v===''||!(n>0)?null:n;};

  function chart(){
    const T=gVar==='peso'?WFA:LFA, key=gVar, unit=gVar==='peso'?'kg':'cm';
    const pts=controles.filter(c=>c[key]>0).map(c=>({m:mesesEn(c.fecha),v:c[key]})).filter(p=>p.m!=null&&p.m>=0&&p.m<=24);
    const edadM=cfg.nacimiento?mesesEn(ymd(Date.now())):6;
    const mMax=Math.min(24,Math.max(6,Math.ceil(Math.max(edadM,...pts.map(p=>p.m),0))+2)), mMin=Math.max(0,Math.floor(Math.min(edadM,...pts.map(p=>p.m)))-3);
    let lo=Infinity,hi=-Infinity; for(let m=mMin;m<=mMax;m+=.5){const r=rowAt(T,m); lo=Math.min(lo,r[0]); hi=Math.max(hi,r[4]);} pts.forEach(p=>{lo=Math.min(lo,p.v);hi=Math.max(hi,p.v);});
    const step=gVar==='peso'?1:5; lo=Math.floor(lo/step)*step; hi=Math.ceil(hi/step)*step;
    const W=340,H=220,L=34,R=34,Tp=10,B=26, X=m=>L+(m-mMin)/(mMax-mMin)*(W-L-R), Y=v=>Tp+(hi-v)/(hi-lo)*(H-Tp-B);
    let g='';
    for(let v=lo;v<=hi;v+=step){ g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" style="stroke:var(--line2)"/><text x="'+(L-6)+'" y="'+(Y(v)+3)+'" text-anchor="end">'+v+'</text>'; }
    const tick=(mMax-mMin)>12?2:1; for(let m=mMin;m<=mMax;m+=tick) g+='<text x="'+X(m)+'" y="'+(H-8)+'" text-anchor="middle">'+m+'</text>';
    const names=['3','15','50','85','97'];
    [0,1,2,3,4].forEach(k=>{ let d=''; for(let m=mMin;m<=mMax+1e-9;m+=.25){ d+=(d?'L':'M')+X(m).toFixed(1)+' '+Y(rowAt(T,m)[k]).toFixed(1); }
      g+='<path d="'+d+'" fill="none" style="stroke:'+(k===2?'var(--accent)':'var(--muted)')+';stroke-width:'+(k===2?2:1)+';opacity:'+(k===2?1:.55)+'"/>';
      g+='<text x="'+(W-R+4)+'" y="'+(Y(rowAt(T,mMax)[k])+3)+'">P'+names[k]+'</text>'; });
    pts.sort((a,b)=>a.m-b.m);
    if(pts.length>1) g+='<path d="'+pts.map((p,i)=>(i?'L':'M')+X(p.m).toFixed(1)+' '+Y(p.v).toFixed(1)).join('')+'" fill="none" style="stroke:var(--m-acc);stroke-width:2"/>';
    pts.forEach(p=>{ g+='<circle cx="'+X(p.m).toFixed(1)+'" cy="'+Y(p.v).toFixed(1)+'" r="4.5" style="fill:var(--m-acc);stroke:var(--surface);stroke-width:2"/>'; });
    const lbl='Curvas de percentiles de '+(gVar==='peso'?'peso':'talla')+' para niñas según la OMS, con '+pts.length+' mediciones de '+esc(cfg.nombre);
    return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+lbl+'">'+g+'</svg><p class="hint" style="text-align:center">Edad en meses · '+unit+'</p>';
  }

      return h+'</div>';
    }
    if(!cfg.nacimiento) return h+'<section class="card"><h2>Falta la fecha de nacimiento</h2><p class="sub" style="margin:0">Cargala en Ajustes para calcular los percentiles.</p><button class="ghost" data-act="tab" data-tab="ajustes" style="color:var(--accent)">Ir a Ajustes</button></section></div>';
    const cs=controles.slice().sort((a,b)=>b.fecha.localeCompare(a.fecha));
    const lp=cs.find(c=>c.peso>0), lt=cs.find(c=>c.talla>0);
    h+='<section class="growth"><div class="gstats num"><div><span class="lbl">Peso</span><b>'+(lp?fmt1(lp.peso)+' kg':'—')+'</b><span class="pc">'+(lp?'Percentil '+(percentil(WFA,mesesEn(lp.fecha),lp.peso)??'—'):'Sin datos')+'</span></div>'+
      '<div><span class="lbl">Talla</span><b>'+(lt?fmt1(lt.talla)+' cm':'—')+'</b><span class="pc">'+(lt?'Percentil '+(percentil(LFA,mesesEn(lt.fecha),lt.talla)??'—'):'Sin datos')+'</span></div></div>';
    h+='<div class="seg" role="group" aria-label="Gráfico"><button data-act="gVar" data-v="peso" aria-pressed="'+(gVar==='peso')+'">Peso</button><button data-act="gVar" data-v="talla" aria-pressed="'+(gVar==='talla')+'">Talla</button></div>'+chart()+'</section>';
    if(canWrite) h+='<button class="ghost" style="color:var(--accent)" data-act="newControl">+ Cargar control</button>';
    if(cs.length){

      cs.forEach(c=>{ const m=mesesEn(c.fecha), [y,mo,d]=c.fecha.split('-');

    } else h+='<p class="empty">Cargá el peso y la talla del último control para ver el percentil.</p>';
    h+='<p class="hint">Percentiles según las tablas de crecimiento de la OMS para niñas de 0 a 2 años, interpolados por edad. Son orientativos: la evaluación la hace el pediatra.</p>';

  }

    const FL={todo:'Todo',tomas:'Solo tomas',panales:'Solo pañales'};
    let h='<div class="wrap" id="historial" style="padding-bottom:16px"><div class="hhead"><h2>Historial</h2>'+(canWrite?'<button class="smallbtn" data-act="manualChoose">+ Cargar a mano</button>':'')+
      '<button class="iconbtn'+(filtro!=='todo'?' on':'')+'" data-act="fToggle" aria-label="Filtrar: '+FL[filtro]+'" aria-expanded="'+fOpen+'"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h18l-7 8v6l-4-2v-4z"/></svg></button>'+
      (fOpen?'<div class="fmenu" role="menu">'+Object.keys(FL).map(k=>'<button role="menuitemradio" aria-checked="'+(filtro===k)+'" data-act="filtro" data-f="'+k+'">'+FL[k]+(filtro===k?'<span aria-hidden="true">✓</span>':'')+'</button>').join('')+'</div>':'')+'</div>';
    let ev=[];
    if(filtro!=='panales') ev=ev.concat(tomas.map(t=>({k:'t',ms:t.inicio,o:t})));
    if(filtro!=='tomas') ev=ev.concat(panales.map(p=>({k:'p',ms:p.hora,o:p})));
    ev.sort((a,b)=>b.ms-a.ms);
    if(!ev.length) return h+'<p class="empty">'+(filtro==='todo'?'Todavía no hay registros.':'No hay registros con este filtro.')+'</p></div>';
    const groups=new Map(); ev.forEach(e=>{const k=ymd(e.ms); if(!groups.has(k)) groups.set(k,[]); groups.get(k).push(e);});
    let n=0; const total=groups.size;
    groups.forEach((evs,key)=>{ if(n++>=histDias) return;
      const tl=tomas.filter(t=>ymd(t.inicio)===key), pl=panales.filter(p=>ymd(p.hora)===key);
      const cm=tl.filter(t=>tomado(t)!=null), tot=sum(cm.map(tomado));
      h+='<div class="dayhead"><h2>'+dayLabel(key)+'</h2><span class="num">'+tl.length+(tl.length===1?' toma':' tomas')+' · '+tot+' ml'+(cm.length?' · prom. '+Math.round(tot/cm.length):'')+' · '+pl.length+(pl.length===1?' pañal':' pañales')+'</span></div><div class="list">';
      evs.forEach(e=>{
        if(e.k==='p'){ const p=e.o;
          h+='<button class="item p" data-act="editPanal" data-id="'+p.id+'" aria-label="Editar pañal de las '+hhmm(p.hora)+'"><span class="ib">'+IC.diaper(19)+'</span><span class="mid"><b class="num">'+hhmm(p.hora)+'</b><span class="sub">Pañal'+(p.nota?' · '+esc(p.nota):'')+'</span></span>'+tagsHtml(p)+'</button>';
          return; }
        const t=e.o, enc=t.fin==null, parts=[enc?'en curso':dur(mins(t.inicio,t.fin))];
        if(sobro(t)) parts.push('sobró '+sobro(t)+' ml');
        if(t.retomas) parts.push('retomó '+t.retomas);
        if(t.nota) parts.push(esc(t.nota));
        h+='<button class="item" data-act="editToma" data-id="'+t.id+'" aria-label="Editar toma de las '+hhmm(t.inicio)+'"><span class="ib">'+IC.bottle(19)+'</span><span class="mid"><b class="num">'+hhmm(t.inicio)+' – '+(enc?'…':hhmm(t.fin))+(enc?'<span class="pill">ahora</span>':'')+'</b><span class="sub">'+parts.join(' · ')+'</span></span><span class="ml num">'+(tomado(t)!=null?tomado(t)+' ml':'— ml')+'</span></button>';
      });
      h+='</div>';
    });
    if(total>histDias) h+='<button class="morebtn" data-act="masDias">Ver días anteriores</button>';
    return h+'</div>';
  }

  // ---------- resumen ----------
  function vResumen(){
    const now=new Date(); if(!mes) mes=new Date(now.getFullYear(),now.getMonth(),1);
    const y=mes.getFullYear(), m=mes.getMonth(), ini=new Date(y,m,1).getTime(), fin=new Date(y,m+1,1).getTime();
    const esActual=y===now.getFullYear()&&m===now.getMonth(), diasMes=new Date(y,m+1,0).getDate();
    const tl=tomas.filter(t=>t.inicio>=ini&&t.inicio<fin&&t.fin!=null), pl=panales.filter(p=>p.hora>=ini&&p.hora<fin);
    const firsts=tl.map(t=>t.inicio).concat(pl.map(p=>p.hora));
    const desde=firsts.length?Math.max(ini,new Date(Math.min(...firsts)).setHours(0,0,0,0)):ini;
    const hasta=esActual?Date.now():fin;
    const dias=Math.max(1,(hasta-desde)/864e5);
    const tomo=sum(tl.map(t=>tomado(t)||0)), sob=sum(tl.map(sobro)), carg=sum(tl.map(cargado)), con=tl.filter(t=>tomado(t)!=null);
    let h='<div class="wrap top"><div class="row"><h1>Resumen</h1><div class="month"><button data-act="mes" data-d="-1" aria-label="Mes anterior">‹</button><span>'+mes.toLocaleDateString('es-AR',{month:'long'})+(y!==now.getFullYear()?' '+y:'')+'</span><button data-act="mes" data-d="1" aria-label="Mes siguiente"'+(esActual?' disabled':'')+'>›</button></div></div>';
    const hayPrecios=(cfg.precios||[]).length>0;
    if(hayPrecios&&(tl.length||pl.length)){
      let cL=0,cS=0,cP=0;
      const hasL=!!precioEn(0,'leche'), hasP=!!precioEn(0,'panal');
      tl.forEach(t=>{const p=precioEn(t.inicio,'leche'); if(!p) return; const k=p.lechePrecio/p.lecheRinde; cL+=cargado(t)*k; cS+=sobro(t)*k;});
      pl.forEach(x=>{const p=precioEn(x.hora,'panal'); if(p) cP+=p.panalPrecio/p.panalUnidades;});
      const tot=cL+cP, diasProy=Math.max(1,(fin-desde)/864e5);
      h+='<section class="spend num"><div class="row base"><span class="lb">Gasto '+(esActual?'en lo que va del mes':'del mes')+'</span><span class="lb">'+money(tot/dias)+' por día</span></div><span class="tot">'+money(tot)+'</span>'+
        (esActual?'<span class="lb">Al ritmo actual, el mes cierra en '+money(tot/dias*diasProy)+'</span>':'')+
        '<div class="two"><div><span>Leche</span><b>'+(hasL?money(cL):'Sin precio')+'</b><span>'+(hasL?money(cS)+' en lo que sobró':'Cargalo en Ajustes')+'</span></div><div><span>Pañales</span><b>'+(hasP?money(cP):'Sin precio')+'</b><span>'+pl.length+' pañales</span></div></div></section>';
    } else if(!hayPrecios){
      h+='<section class="card"><h2>Gasto del mes</h2><p class="sub" style="margin:0">Cargá el precio de la leche y de los pañales para ver cuánto se gasta por mes.</p>'+(canWrite?'<button class="ghost" data-act="tab" data-tab="ajustes" style="color:var(--accent)">Cargar precios en Ajustes</button>':'')+'</section>';
    }
    const rangos=[[1,7],[8,14],[15,21],[22,diasMes]];
    const sem=rangos.map(([a,b])=>{const s=new Date(y,m,a).getTime(),e=new Date(y,m,b+1).getTime();const ts=tl.filter(t=>t.inicio>=s&&t.inicio<e);return{t:sum(ts.map(t=>tomado(t)||0)),s:sum(ts.map(sobro))};});
    const max=Math.max(1,...sem.map(x=>x.t+x.s)), HB=124;
    h+='<section class="card"><div class="row base"><h2>Leche por semana</h2><span class="sub">'+(carg&&sob?'Sobró el '+Math.round(sob/carg*100)+' %':'')+'</span></div>';
    h+='<div class="bars" role="img" aria-label="Leche tomada y sobrante por semana: '+sem.map((x,i)=>'días '+rangos[i][0]+' a '+rangos[i][1]+', '+lit(x.t)+' tomados y '+lit(x.s)+' sobraron').join('; ')+'">'+
      sem.map(x=>{const ht=Math.round(x.t/max*HB), hs=x.s?Math.max(3,Math.round(x.s/max*HB)):0;return '<div class="bar"><span class="num">'+(x.t?lit(x.t):'')+'</span><div class="stk'+(hs?'':' only')+'">'+(hs?'<div class="s" style="height:'+hs+'px"></div>':'')+'<div class="t" style="height:'+ht+'px"></div></div></div>';}).join('')+'</div>';
    h+='<div class="xl num">'+rangos.map(r=>'<span>'+r[0]+'–'+r[1]+'</span>').join('')+'</div><div class="legend"><span><i style="background:var(--bar)"></i>Tomó</span><span><i style="background:var(--bar2)"></i>Sobró</span></div></section>';
    h+='<div class="mini num"><div><span>Por día</span><b>'+Math.round(tomo/dias)+' ml</b><span>'+dec(tl.length/dias)+' tomas</span></div>'+
      '<div><span>Por toma</span><b>'+(con.length?Math.round(tomo/con.length):0)+' ml</b><span>'+tl.length+' en el mes</span></div>'+
      '<div><span>Pañales/día</span><b>'+dec(pl.length/dias)+'</b><span>'+dec(pl.filter(p=>p.caca).length/dias)+' con caca</span></div></div>';
    return h+'</div>';
  }

  // ---------- ajustes ----------
  function vAjustes(){
    const p=(cfg.precios||[]).slice().sort((a,b)=>b.desde-a.desde)[0]||{};
    const t=getTema(), dis=canWrite?'':' disabled';
    let h='<div class="wrap top"><h1>Ajustes</h1>';
    h+='<section class="set"><h2>Bebé</h2><div class="row" style="justify-content:flex-start;gap:14px"><div class="avatar">'+(foto?'<img src="'+foto+'" alt="" style="object-position:50% '+(Number(cfg.fotoPos)||35)+'%">':IC.camera)+'</div><div style="display:flex;gap:8px;flex-wrap:wrap">'+
      (canWrite?'<label class="filebtn">'+(foto?'Cambiar foto':'Elegir foto')+'<input type="file" id="fFoto" accept="image/*"></label>'+(foto?'<button class="ghost" style="min-height:42px" data-act="quitarFoto">Quitar</button>':''):'')+'</div></div>';
    if(foto&&canWrite) h+='<label class="fld">Encuadre de la foto: más arriba o más abajo<input type="range" id="fPos" min="0" max="100" value="'+(Number(cfg.fotoPos)||35)+'"></label>';
    h+='<div class="fields"><label class="fld">Nombre<input id="cNombre" type="text" maxlength="30" value="'+esc(cfg.nombre)+'"'+dis+'></label><label class="fld">Fecha de nacimiento<input id="cNac" type="date" value="'+esc(cfg.nacimiento)+'"'+dis+'></label></div></section>';

    h+='<section class="set"><h2>Mamaderas</h2>';
    h+='<div class="row"><span>Espera antes de acostar</span><div class="step"><button data-act="step" data-k="espera" data-d="-5" aria-label="Restar 5 minutos"'+dis+'>−</button><b class="num">'+cfg.espera+' min</b><button data-act="step" data-k="espera" data-d="5" aria-label="Sumar 5 minutos"'+dis+'>+</button></div></div>';
    h+='<div class="row"><span>Se puede retomar hasta</span><div class="step"><button data-act="step" data-k="retomarHoras" data-d="-1" aria-label="Restar una hora"'+dis+'>−</button><b class="num">'+cfg.retomarHoras+' h</b><button data-act="step" data-k="retomarHoras" data-d="1" aria-label="Sumar una hora"'+dis+'>+</button></div></div>';
    h+='<div class="row"><span>Ofrecer anotar lo que sobró</span><button class="sw" role="switch" aria-checked="'+(!!cfg.preguntarSobro)+'" aria-label="Ofrecer anotar lo que sobró" data-act="sw" data-k="preguntarSobro"'+dis+'><i></i></button></div></section>';

    h+='<section class="set"><h2>Costos</h2><div class="fields"><label class="fld">Leche: precio del envase ($)<input id="pLP" type="text" inputmode="numeric" value="'+(p.lechePrecio||'')+'" placeholder="Ej.: 18000"'+dis+'></label><label class="fld">Rinde (ml preparados)<input id="pLR" type="text" inputmode="numeric" value="'+(p.lecheRinde||'')+'" placeholder="Ej.: 5600"'+dis+'></label></div>'+
      '<div class="fields"><label class="fld">Pañales: precio del paquete ($)<input id="pPP" type="text" inputmode="numeric" value="'+(p.panalPrecio||'')+'" placeholder="Ej.: 25000"'+dis+'></label><label class="fld">Unidades por paquete<input id="pPU" type="text" inputmode="numeric" value="'+(p.panalUnidades||'')+'" placeholder="Ej.: 50"'+dis+'></label></div>'+
      ((p.lecheRinde||p.panalUnidades)?'<p class="hint num">'+[p.lecheRinde?money(p.lechePrecio/p.lecheRinde*100)+' cada 100 ml':'',p.panalUnidades?money(p.panalPrecio/p.panalUnidades)+' por pañal':''].filter(Boolean).join(' · ')+(p.desde?' · vigente desde el '+new Date(p.desde).toLocaleDateString('es-AR'):'')+'. Si cambia el precio, guardalo de nuevo: los días anteriores mantienen el precio de antes.</p>':'<p class="hint">Se usan para calcular el gasto del mes en Resumen.</p>')+
      (canWrite?'<button class="primary" data-act="guardarPrecios" style="min-height:48px;font-size:17px">Guardar precios</button>':'')+'</section>';

    h+='<section class="set"><h2>Apariencia</h2><div class="row" style="flex-wrap:wrap"><span>Tema</span><div class="seg" role="group" aria-label="Tema" style="min-width:210px">'+[['auto','Auto'],['light','Claro'],['dark','Noche']].map(([k,l])=>'<button data-act="tema" data-v="'+k+'" aria-pressed="'+(t===k)+'">'+l+'</button>').join('')+'</div></div><p class="hint">Noche es el tema de siempre. Auto sigue el modo del celular. Esta opción se guarda solo en este celular.</p></section>';

    const srv=!!(window.claude&&window.claude.servidor);
    if(downloads||srv){
      h+='<section class="set"><h2>Datos</h2>';
      if(downloads) h+='<div class="row"><span>Planilla de tomas y pañales</span><button class="ghost" style="min-height:42px;color:var(--accent)" data-act="csv">Descargar CSV</button></div>'+
        '<div class="row"><span>Copia completa de todo</span><button class="ghost" style="min-height:42px;color:var(--accent)" data-act="backup">Descargar copia</button></div>';
      if(srv&&canWrite) h+='<div class="row"><span>Importar una copia</span><label class="filebtn">Elegir archivo<input type="file" id="fImport" accept=".json,application/json"></label></div><p class="hint">Agrega los registros de la copia que no estén cargados. No borra nada.</p>';
      if(srv&&window.claude.desconectarTodo) h+='<div class="row"><span>Desconectar todos los celulares</span><button class="ghost" style="min-height:42px;color:var(--danger)" data-act="desconectar">Desconectar</button></div><p class="hint">Usalo si perdés un celular o cambiás el PIN. Después cada uno vuelve a entrar con el PIN.</p>';
      h+='</section>';
    }
    return h+'</div>';
  }

  // ---------- hojas ----------
  function sheet(html){const s=$('sheet');s.className='sheetbg';s.hidden=false;s.innerHTML='<div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>'+html+'</div>';s.onclick=e=>{if(e.target===s)close();};}
  function close(){const s=$('sheet'); const was=!s.hidden; s.hidden=true; s.innerHTML=''; if(was) rerenderSoft();}

  function openNumber(title,cb){
    sheet('<h2>'+title+'</h2><label class="fld">Mililitros<input id="nVal" type="number" inputmode="numeric" min="1" max="1000" style="font-family:var(--display);font-size:24px;text-align:center"></label><div class="foot"><button class="ghost" id="nBack">Volver</button><button class="primary" id="nOk">Listo</button></div>');
    setTimeout(()=>{const i=$('nVal'); if(i) i.focus();},60);
    $('nBack').onclick=close;
    $('nOk').onclick=()=>{const v=Math.round(Number($('nVal').value)); if(!(v>0&&v<=1000)){toast('Poné una cantidad entre 1 y 1000 ml.');return;} close(); cb(v);};
  }

  const mlBox=v=>'<div class="mlbox"><button type="button" class="opt" data-d="-10" aria-label="Restar 10 ml">−10</button><input id="fMl" type="number" inputmode="numeric" min="0" max="1000" placeholder="ml" value="'+(v??'')+'"><button type="button" class="opt" data-d="10" aria-label="Sumar 10 ml">+10</button></div>';
  function wireMlBox(){ document.querySelectorAll('.sheet [data-d]').forEach(b=>b.onclick=()=>{const i=$('fMl'); i.value=Math.max(0,(Number(i.value)||0)+Number(b.dataset.d));}); }
  const readMl=()=>{const v=$('fMl').value.trim(); return v===''?null:Math.max(0,Math.round(Number(v)));};
  function sobroPicker(zoneId,initial,onChange){
    const z=$(zoneId);
    z.innerHTML='<div style="display:flex;flex-direction:column;gap:6px"><span class="lbl">¿Sobró algo? (opcional)</span><div class="grid g5 small" id="sobOpts">'+[[0,'Nada'],[10,'10'],[20,'20'],[30,'30']].map(([v,l])=>'<button type="button" class="opt'+(v===0?' txt':'')+(v===initial?' sel':'')+'" data-v="'+v+'">'+l+'</button>').join('')+'<button type="button" class="opt txt'+(initial&&![10,20,30].includes(initial)?' sel':'')+'" data-v="otro">Otro</button></div><input id="sobOtro" class="inp" type="number" inputmode="numeric" min="0" placeholder="ml que sobraron" value="'+(initial&&![10,20,30].includes(initial)?initial:'')+'"'+(initial&&![10,20,30].includes(initial)?'':' hidden')+'></div>';
    $('sobOpts').onclick=e=>{const b=e.target.closest('[data-v]'); if(!b) return;
      document.querySelectorAll('#sobOpts .opt').forEach(x=>x.classList.toggle('sel',x===b));
      const o=$('sobOtro'); if(b.dataset.v==='otro'){o.hidden=false;o.focus();onChange(Math.max(0,Math.round(Number(o.value))||0));} else {o.hidden=true;onChange(Number(b.dataset.v));}};
    $('sobOtro').oninput=()=>onChange(Math.max(0,Math.round(Number($('sobOtro').value))||0));
  }

  function openFinish(t){
    const prev=tomado(t)||0, t0=Date.now(), def=hhmm(t0); let sob=0;
    let h='<div class="row base"><h2>Terminó la toma</h2><span class="sub num">'+hhmm(t.inicio)+' → '+def+'</span></div>';
    h+='<div class="fld"><span>¿Cuánto tomó? (ml)</span>'+mlBox(prev||'')+'</div>';
    if(prev) h+='<p class="hint">Antes de retomar llevaba '+prev+' ml. Sumale lo nuevo:</p><div class="grid g4" id="addOpts">'+[10,20,30,50].map(n=>'<button type="button" class="opt" data-add="'+n+'">+'+n+'</button>').join('')+'</div>';
    h+='<div class="row"><span class="lbl" style="font-size:14px">Hora de fin</span><input id="fFin" class="inp" type="time" value="'+def+'"></div>';
    if(cfg.preguntarSobro) h+='<div id="sobZone"></div>';
    h+='<div class="foot"><button class="ghost" id="sBack">Volver</button><button class="primary" id="sSave">Guardar</button></div>';
    sheet(h); wireMlBox();
    if(prev) $('addOpts').onclick=e=>{const b=e.target.closest('[data-add]'); if(b) $('fMl').value=prev+Number(b.dataset.add);};
    if(cfg.preguntarSobro) sobroPicker('sobZone',0,v=>{sob=v;});
    $('sBack').onclick=close;
    $('sSave').onclick=async()=>{
      const ft=$('fFin').value; if(!ft){toast('Poné la hora de fin.');return;}
      let fin=ft===def?t0:ajustarFin(t.inicio,build(ymd(t.inicio),ft)); if(fin==null) return;
      if(await safe(()=>colT.doc(t.id).update({fin,ml:readMl(),sobro:sob,cargas:[]}),'Toma guardada')) close();
    };
  }

  function confirmDel(zoneId,back,doDel,msg){
    $(zoneId).innerHTML='<p class="hint" style="width:100%;text-align:center">¿Seguro? No se puede deshacer.</p><div class="foot" style="width:100%"><button class="ghost" id="dNo">No</button><button class="danger" id="dYes">Sí, borrar</button></div>';
    $('dNo').onclick=back;
    $('dYes').onclick=async()=>{if(await safe(doDel,msg)) close();};
  }

  function openEditToma(t){
    const nueva=!t, ini=t?t.inicio:Date.now(); let sob=t?sobro(t):0;
    sheet('<h2>'+(nueva?'Cargar toma a mano':'Editar toma')+'</h2>'+
      '<div class="fields"><label class="fld">Fecha<input id="eDate" type="date" value="'+ymd(ini)+'"></label></div>'+
      '<div class="fields"><label class="fld">Inicio<input id="eIni" type="time" value="'+hhmm(ini)+'"></label><label class="fld">Fin<input id="eFin" type="time" value="'+(t&&t.fin?hhmm(t.fin):'')+'"></label></div>'+
      '<div class="fld"><span>Tomó (ml)</span>'+mlBox(t?tomado(t):'')+'</div>'+
      '<div id="sobZone"></div>'+
      '<label class="fld">Nota (opcional)<input id="eNota" type="text" maxlength="80" placeholder="Ej.: regurgitó un poco" value="'+esc(t&&t.nota)+'"></label>'+
      '<p class="hint">'+(t?'Si dejás el fin vacío, la toma queda en curso.':'Si no sabés la hora de fin, dejala vacía y completala después.')+'</p>'+
      '<div class="foot"><button class="ghost" id="eBack">Volver</button><button class="primary" id="eSave">Guardar</button></div>'+
      (t?'<div id="delZone" class="links"><button class="link" id="eDel">Borrar esta toma</button></div>':''));
    wireMlBox();
    sobroPicker('sobZone',sob,v=>{sob=v;});
    $('eBack').onclick=close;
    $('eSave').onclick=async()=>{
      const d=$('eDate').value,i=$('eIni').value,f=$('eFin').value;
      if(!d||!i){toast('Completá fecha y hora de inicio.');return;}
      const inicio=build(d,i); let fin=null; if(f){fin=ajustarFin(inicio,build(d,f)); if(fin==null) return;}
      const a=active(); if(fin==null&&a&&(!t||a.id!==t.id)){toast('Ya hay una toma en curso. Poné la hora de fin.');return;}
      const data={inicio,fin,ml:readMl(),sobro:sob,cargas:[],nota:$('eNota').value.trim()};
      const ok=nueva?await safe(()=>colT.add(Object.assign({retomas:0},data)),'Toma cargada'):await safe(()=>colT.doc(t.id).update(data),'Cambios guardados');
      if(ok) close();
    };
    if(t) $('eDel').onclick=()=>confirmDel('delZone',()=>openEditToma(t),()=>colT.doc(t.id).delete(),'Toma borrada');
  }

  function openPanal(p){
    const nuevo=!p, h=p?p.hora:Date.now();
    sheet('<h2>'+(nuevo?'Cargar pañal a mano':'Editar pañal')+'</h2>'+
      '<div class="fields"><label class="fld">Fecha<input id="pDate" type="date" value="'+ymd(h)+'"></label><label class="fld">Hora<input id="pHora" type="time" value="'+hhmm(h)+'"></label></div>'+
      '<div class="toggles"><label class="tog pis"><input type="checkbox" id="pPis"'+(p&&p.pis?' checked':'')+'> Pis</label><label class="tog caca"><input type="checkbox" id="pCaca"'+(p&&p.caca?' checked':'')+'> Caca</label></div>'+
      '<label class="fld">Nota (opcional)<input id="pNota" type="text" maxlength="80" placeholder="Ej.: paspadura" value="'+esc(p&&p.nota)+'"></label>'+
      '<div class="foot"><button class="ghost" id="pBack">Volver</button><button class="primary" id="pSave">Guardar</button></div>'+
      (p?'<div id="delZone" class="links"><button class="link" id="pDel">Borrar este pañal</button></div>':''));
    $('pBack').onclick=close;
    $('pSave').onclick=async()=>{
      const d=$('pDate').value,t=$('pHora').value,pis=$('pPis').checked,caca=$('pCaca').checked;
      if(!d||!t){toast('Completá fecha y hora.');return;} if(!pis&&!caca){toast('Marcá pis, caca o los dos.');return;}
      const data={hora:build(d,t),pis,caca,nota:$('pNota').value.trim()};
      const ok=nuevo?await safe(()=>colP.add(data),'Pañal cargado'):await safe(()=>colP.doc(p.id).update(data),'Cambios guardados');
      if(ok) close();
    };
    if(p) $('pDel').onclick=()=>confirmDel('delZone',()=>openPanal(p),()=>colP.doc(p.id).delete(),'Pañal borrado');
  }

  // ---------- acciones ----------
  function startToma(){
    if(active()){toast('Ya hay una toma en curso.');return;}
    safe(()=>colT.add({inicio:Date.now(),fin:null,ml:null,sobro:0,retomas:0,nota:''}),'Toma iniciada');
  }
  function addCarga(n){
    const a=active(); if(!a) return; const prev=a.cargas||[], c=prev.concat([n]);
    safe(()=>colT.doc(a.id).update({cargas:c,ml:sum(c)-sobro(a)}),(prev.length?'Recarga de ':'Empezó con ')+n+' ml');
  }
  async function guardarFoto(file){
    if(!file) return;
    try{
      const url=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file);});
      const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url;});
      let W=1000,q=.82,out='';
      for(let k=0;k<6;k++){
        const s=Math.min(1,W/Math.max(img.width,img.height)), cv=document.createElement('canvas');
        cv.width=Math.round(img.width*s); cv.height=Math.round(img.height*s);
        cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
        out=cv.toDataURL('image/jpeg',q); if(out.length<230000) break; W=Math.round(W*.8); q=Math.max(.6,q-.05);
      }
      if(out.length>=230000){toast('La foto es muy pesada. Probá con otra.');return;}
      if(await safe(()=>fotoRef.set({data:out,actualizado:Date.now()}),'Foto guardada')){foto=out;render();}
    }catch(e){toast('No se pudo leer la foto. Probá con otra.');}
  }
  function backupJson(){
    const cfgDocs=[Object.assign({id:'ajustes'},cfg)]; if(foto) cfgDocs.push({id:'foto',data:foto,actualizado:Date.now()});
    const data=JSON.stringify({version:1,exportado:new Date().toISOString(),colecciones:{tomas,panales,medicamentos:meds,dosis,controles,config:cfgDocs}});
    downloads.save({filename:'copia-'+String(cfg.nombre||'bebe').toLowerCase().replace(/[^a-z0-9]+/g,'-')+'-'+ymd(Date.now())+'.json',data}).catch(e=>{ if(!e||e.code!=='declined') toast('No se pudo descargar la copia.'); });
  }
  async function importar(file){
    if(!file) return;
    try{
      const j=JSON.parse(await file.text());
      const r=await window.claude.importar(j,false);
      const n=Object.values(r.agregados||{}).reduce((a,b)=>a+b,0);
      toast(n?'Importados '+n+' registros':'No había registros nuevos para importar');
      if(n) setTimeout(()=>location.reload(),1500);
    }catch(e){ toast('No se pudo importar: revisá que sea el archivo de copia.'); }
  }
  function csv(){
    const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
    const rows=[['Tipo','Fecha','Inicio','Fin','Cargado (ml)','Sobró (ml)','Tomó (ml)','Retomas','Pis','Caca','Nota']];
    tomas.slice().sort((a,b)=>a.inicio-b.inicio).forEach(t=>rows.push(['Toma',ymd(t.inicio),hhmm(t.inicio),t.fin?hhmm(t.fin):'',cargado(t)||'',sobro(t)||'',tomado(t)??'',t.retomas||0,'','',t.nota||'']));
    panales.slice().sort((a,b)=>a.hora-b.hora).forEach(p=>rows.push(['Pañal',ymd(p.hora),hhmm(p.hora),'','','','','',p.pis?'Sí':'',p.caca?'Sí':'',p.nota||'']));
    const data='﻿'+rows.map(r=>r.map(q).join(';')).join('\r\n');
    downloads.save({filename:'registro-'+String(cfg.nombre||'bebe').toLowerCase().replace(/[^a-z0-9]+/g,'-')+'-'+ymd(Date.now())+'.csv',data}).catch(e=>{ if(!e||e.code!=='declined') toast('No se pudo descargar la planilla.'); });
  }

  document.addEventListener('click',e=>{
    const b=e.target.closest('[data-act]');
    if(fOpen&&!e.target.closest('.fmenu')&&!(b&&b.dataset.act==='fToggle')){ fOpen=false; if(!b) rerenderSoft(); }
    if(!b||b.disabled) return;
    const act=b.dataset.act, id=b.dataset.id;
    switch(act){
      case 'tab': tab=b.dataset.tab; close(); render(); window.scrollTo(0,0); break;
      case 'start': startToma(); break;
      case 'startOtro': openNumber('¿Con cuánto empezó?',v=>startToma(v)); break;
      case 'addCarga': addCarga(Number(b.dataset.ml)); break;
      case 'addCargaOtro': { const a=active(); openNumber(a&&a.cargas&&a.cargas.length?'¿Cuánto recargó?':'¿Con cuánto empezó?',v=>addCarga(v)); break; }
      case 'resume': { const ld=lastDone(); if(!ld) break;
        safe(()=>colT.doc(ld.id).update({fin:null,retomas:(ld.retomas||0)+1}),'Sigue la misma toma'); break; }
      case 'finish': { const a=active(); if(a) openFinish(a); break; }
      case 'cancel': { const a=active(); if(!a) break;
        sheet('<h2>¿Cancelar esta toma?</h2><p class="sub" style="margin:0">Se borra la toma que empezó a las '+hhmm(a.inicio)+'. Usalo si tocaste el botón por error.</p><div class="foot"><button class="ghost" id="cNo">No, volver</button><button class="danger" id="cYes">Sí, borrar</button></div>');
        $('cNo').onclick=close; $('cYes').onclick=async()=>{if(await safe(()=>colT.doc(a.id).delete(),'Toma cancelada')) close();}; break; }
      case 'editToma': { const t=tomas.find(x=>x.id===id); if(t&&canWrite) openEditToma(t); break; }
      case 'manualToma': openEditToma(null); break;
      case 'panal': { const pis=b.dataset.pis==='1',caca=b.dataset.caca==='1'; safe(()=>colP.add({hora:Date.now(),pis,caca,nota:''}),'Pañal guardado: '+tipoTxt({pis,caca})); break; }
      case 'manualPanal': openPanal(null); break;
      case 'editPanal': { const p=panales.find(x=>x.id===id); if(p&&canWrite) openPanal(p); break; }
      case 'manualChoose':
        sheet('<h2>Cargar a mano</h2><div class="grid g2"><button class="ghost" id="mT">Toma</button><button class="ghost" id="mP">Pañal</button></div>');
        $('mT').onclick=()=>openEditToma(null); $('mP').onclick=()=>openPanal(null); break;
      case 'filtro': filtro=b.dataset.f; fOpen=false; histDias=2; rerenderSoft(); break;
      case 'fToggle': fOpen=!fOpen; rerenderSoft(); break;
      case 'masDias': histDias+=7; rerenderSoft(); break;
      case 'reMed': { const m=meds.find(x=>x.id===id); if(m&&canWrite) safe(()=>colM.doc(m.id).update({activo:true,hasta:''}),m.nombre+' activo de nuevo'); break; }
      case 'mes': mes=new Date(mes.getFullYear(),mes.getMonth()+Number(b.dataset.d),1); render(); break;
      case 'step': { const k=b.dataset.k, lim=k==='espera'?[5,60]:[1,6]; const v=Math.min(lim[1],Math.max(lim[0],(Number(cfg[k])||0)+Number(b.dataset.d))); if(v!==cfg[k]){ saveCfg({[k]:v}); render(); } break; }
      case 'sw': saveCfg({[b.dataset.k]:!cfg[b.dataset.k]}); render(); break;
      case 'tema': applyTema(b.dataset.v); render(); break;
      case 'quitarFoto': safe(()=>fotoRef.delete(),'Foto quitada').then(ok=>{if(ok){foto=null;render();}}); break;
      case 'guardarPrecios': {
        const n=k=>Math.round(Number(String($(k).value).replace(/[^0-9,]/g,'').replace(',','.')));
        const v={lp:n('pLP')||0,lr:n('pLR')||0,pp:n('pPP')||0,pu:n('pPU')||0};
        if((v.lp>0)!==(v.lr>0)){toast('Para la leche completá el precio y cuántos ml rinde.');break;}
        if((v.pp>0)!==(v.pu>0)){toast('Para los pañales completá el precio y las unidades del paquete.');break;}
        if(!(v.lp>0)&&!(v.pp>0)){toast('Cargá al menos el precio de la leche o el de los pañales.');break;}
        const e={desde:Date.now(),lechePrecio:v.lp,lecheRinde:v.lr,panalPrecio:v.pp,panalUnidades:v.pu};
        let lista=(cfg.precios||[]).slice().sort((a,b)=>a.desde-b.desde);
        if(!lista.length) e.desde=0;
        else { const ult=lista[lista.length-1]; if(ult.desde!==0&&ymd(ult.desde)===ymd(Date.now())) lista.pop(); else if(lista.length===1&&ult.desde===0&&false) lista.pop(); }
        lista.push(e); if(lista.length>60) lista=lista.slice(-60);
        saveCfg({precios:lista},'Precios guardados').then(()=>render()); break; }
      case 'csv': if(downloads) csv(); break;
      case 'backup': if(downloads) backupJson(); break;
      case 'desconectar':
        sheet('<h2>¿Desconectar todos los celulares?</h2><p class="sub" style="margin:0">Este celular y los demás van a tener que volver a poner el PIN.</p><div class="foot"><button class="ghost" id="dNo">No</button><button class="danger" id="dYes">Sí, desconectar</button></div>');
        $('dNo').onclick=close; $('dYes').onclick=()=>window.claude.desconectarTodo().catch(()=>toast('No se pudo desconectar.')); break;
      case 'saludTab': saludTab=b.dataset.v; render(); break;
      case 'gVar': gVar=b.dataset.v; render(); break;
      case 'newMed': openMed(null); break;
      case 'editMed': { const m=meds.find(x=>x.id===id); if(m&&canWrite) openMed(m); break; }
      case 'darMed': { const m=meds.find(x=>x.id===id); if(m) darMed(m); break; }
      case 'editDosis': { const d=dosis.find(x=>x.id===id); if(d&&canWrite) openDosis(d); break; }
      case 'newControl': openControl(null); break;
      case 'editControl': { const c=controles.find(x=>x.id===id); if(c&&canWrite) openControl(c); break; }
    }
  });
  document.addEventListener('change',e=>{
    const t=e.target; if(!canWrite) return;
    if(t.id==='fFoto') guardarFoto(t.files&&t.files[0]);
    else if(t.id==='fImport') importar(t.files&&t.files[0]);
    else if(t.id==='fPos') saveCfg({fotoPos:Number(t.value)});
    else if(t.id==='cNombre'){ const v=t.value.trim()||'Sol'; if(v!==cfg.nombre) saveCfg({nombre:v},'Nombre guardado'); }
    else if(t.id==='cNac'){ if(t.value!==cfg.nacimiento) saveCfg({nacimiento:t.value},'Fecha guardada'); }
    else if(t.id==='cCargas'||t.id==='cRecargas'){ const l=parseList(t.value).slice(0,3); if(!l.length){toast('Poné al menos una cantidad.');return;} saveCfg({[t.id==='cCargas'?'cargas':'recargas']:l},'Botones guardados'); t.value=l.join(', '); }
  });

  // ---------- atajos de Siri: #empezo y #termino ----------
  const H=(location.hash||'').slice(1).toLowerCase();
  if(['inicio','salud','resumen','ajustes'].includes(H)) tab=H; else if(H==='historial') tab='inicio';
  let hashDone=false;
  function handleHash(){
    if(hashDone||!loadedT) return; hashDone=true;
    if(!canWrite) return;
    if(H==='empezo'){
      const a=active(); if(a){toast('Ya hay una toma en curso desde las '+hhmm(a.inicio));return;}
      const last=tomas[0]; if(last&&Date.now()-last.inicio<10*60e3){toast('Ya se registró una toma a las '+hhmm(last.inicio));return;}
      safe(()=>colT.add({inicio:Date.now(),fin:null,ml:null,sobro:0,retomas:0,nota:''}),'Toma iniciada desde Siri');
    } else if(H==='termino'){ const a=active(); if(a) openFinish(a); else toast('No hay ninguna toma en curso.'); }
  }

  // ---------- arranque ----------
  render();
  setInterval(()=>{ if(tab==='inicio'||tab==='salud') rerenderSoft(); },60000);
  (async()=>{
    try{ db=await window.claude.use('db'); }catch(e){ db=null; }
    if(!db){ render(); return; }
    colT=db.collection('tomas'); colP=db.collection('panales');
    cfgRef=db.collection('config').doc('ajustes'); fotoRef=db.collection('config').doc('foto');
    try{ const u=await window.claude.use('user'); const w=u?await u.can('data.write'):null; if(w===false) canWrite=false; }catch(e){}
    try{ downloads=await window.claude.use('downloads'); }catch(e){ downloads=null; }
    render();
    colT.orderBy('inicio','desc').limit(500).onSnapshot(s=>{
      tomas=s.docs.map(d=>Object.assign({id:d.id},d.data())).filter(t=>typeof t.inicio==='number'); loadedT=true; rerenderSoft();
      if(!s.metadata.fromCache) handleHash();
    },()=>toast('Se cortó la conexión. Recargá la página.'));
    colP.orderBy('hora','desc').limit(500).onSnapshot(s=>{
      panales=s.docs.map(d=>Object.assign({id:d.id},d.data())).filter(p=>typeof p.hora==='number'); rerenderSoft();
    },()=>{});
    colM=db.collection('medicamentos'); colD=db.collection('dosis'); colC=db.collection('controles');
    colM.orderBy('nombre','asc').limit(200).onSnapshot(s=>{ meds=s.docs.map(d=>Object.assign({id:d.id},d.data())); rerenderSoft(); },()=>{});
    colD.orderBy('hora','desc').limit(500).onSnapshot(s=>{ dosis=s.docs.map(d=>Object.assign({id:d.id},d.data())).filter(d=>typeof d.hora==='number'); rerenderSoft(); },()=>{});
    colC.orderBy('fecha','desc').limit(200).onSnapshot(s=>{ controles=s.docs.map(d=>Object.assign({id:d.id},d.data())).filter(c=>typeof c.fecha==='string'); rerenderSoft(); },()=>{});
    cfgRef.onSnapshot(s=>{ cfg=Object.assign({},DEF,s.exists?s.data():{}); rerenderSoft(); },()=>{});
    fotoRef.onSnapshot(s=>{ const d=s.exists?s.data():null; foto=d&&d.data?d.data:null; rerenderSoft(); },()=>{});
  })();
})();
</script>
